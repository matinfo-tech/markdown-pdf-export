name: Publish npm package + MCP Registry

# Release flow:
#   1. bump "version" in package.json and add a "## [<version>]" section to CHANGELOG.md
#   2. git tag v<version> && git push origin v<version>
# server.json versions are synced from the tag below. Once npm and the MCP
# Registry have the version, the release job creates the GitHub release with
# that CHANGELOG section as its notes.
#
# Authentication: npm trusted publishing (OIDC). No NPM_TOKEN secret.
#   One-time setup on npmjs.com → package Settings → Trusted Publisher:
#     Organization or user: matinfo-tech
#     Repository:           markdown-pdf-export
#     Workflow filename:    npm-publish.yml
#   The package must already exist on npm, so publish the very first version
#   by hand (`npm publish`). The publish step below is skipped when the tagged
#   version is already on npm, so that first tag still registers the server
#   in the MCP Registry.

on:
  push:
    tags:
      - "v[0-9]*"

permissions: {} # each job asks for what it needs

env:
  MCP_PUBLISHER_VERSION: v1.8.1 # bump deliberately; never use releases/latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for npm trusted publishing and the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Check tag matches package.json
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Publish package to npm (trusted publishing, provenance is automatic)
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on npm — skipping npm publish."
          else
            npm publish # prepack builds vendor/katex-inline.css
          fi

      - name: Wait until the version is visible on npm
        # The MCP Registry checks npm for this version; a fresh publish can
        # take a few minutes to show up there.
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "$NAME@$VERSION is on npm."
              exit 0
            fi
            echo "Waiting for $NAME@$VERSION on npm ($i/30)…"
            sleep 20
          done
          echo "::error::$NAME@$VERSION did not appear on npm within 10 minutes. If it is a staged release, approve it on npmjs.com, then re-run this job."
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Set version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(node -p "require('./package.json').name")"
          # The "## [<version>]" section, up to the next "## [".
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::No \"## [$VERSION]\" section in CHANGELOG.md; using GitHub's generated notes."
            : > notes.md
          fi
          printf '\nnpm: https://www.npmjs.com/package/%s/v/%s\n' "$NAME" "$VERSION" >> notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(node -p "require('./package.json').name")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; updating its notes."
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            exit 0
          fi
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac # 2.2.0-beta.1
          if [ "$(wc -l < notes.md)" -le 2 ]; then flags+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$NAME $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
