name: Release Server

on:
  push:
    tags:
      - "server-v*"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install --prefix server

      - name: Run test suite
        run: node --test server/lib/__tests__/*.test.mjs

  package-and-release:
    name: Package & publish server archive
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify SERVER_RELEASE_TAG matches pushed tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED=$(grep 'SERVER_RELEASE_TAG' src/lib.rs | grep -oP '"\K[^"]+' | head -1)
          echo "Pushed tag   : $TAG"
          echo "lib.rs tag   : $EXPECTED"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo ""
            echo "❌ Mismatch — update SERVER_RELEASE_TAG in src/lib.rs to \"$TAG\" before pushing this tag."
            exit 1
          fi
          echo "✅ Tag matches SERVER_RELEASE_TAG in src/lib.rs"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server deps (for KaTeX CSS bundling)
        run: npm ci --prefix server --no-audit --no-fund

      - name: Package server archive (bundles production node_modules)
        run: ./scripts/package-server.sh .

      - name: Create GitHub release and upload archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Server ${{ github.ref_name }}"
          body: |
            MCP server bundle for the **Markdown PDF** Zed extension.

            This archive is downloaded automatically by the extension on first use.
            For the CLI / Zed task / MCP-registry setup, use the npm package `markdown-pdf-export` instead.

            ### Contents
            | File | Description |
            |------|-------------|
            | `markdown_pdf_server.mjs` | MCP entry point (shim → `mcp.mjs`) |
            | `export.mjs`, `cli.mjs`, `tool-schemas.mjs`, `lib/` | Core, CLI and shared schemas |
            | `default.css`, `vendor/` | Built-in stylesheet, KaTeX CSS with inlined fonts |
            | `node_modules/` | Production dependencies (nothing is installed at runtime) |
          files: markdown-pdf-server.tar.gz
          fail_on_unmatched_files: true
